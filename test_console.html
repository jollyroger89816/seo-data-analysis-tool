<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Console测试</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container mt-4">
        <h3>JavaScript Console测试</h3>
        <div id="results"></div>
        <button id="testBtn" class="btn btn-primary">开始测试API</button>
    </div>

    <script>
        console.log('页面加载完成，开始测试...');
        
        // 测试API响应
        async function testAPIs() {
            console.log('=== 开始API测试 ===');
            const resultsDiv = document.getElementById('results');
            
            try {
                // 测试1: 获取最新分析信息
                console.log('1. 测试最新分析信息API...');
                const response1 = await fetch('http://120.48.54.112:5051/rank/api/get_analysis_info');
                console.log('最新分析信息API响应状态:', response1.status);
                
                const data1 = await response1.json();
                console.log('最新分析信息API响应数据:', data1);
                
                resultsDiv.innerHTML += `<div class="alert alert-info">
                    <strong>最新分析信息:</strong><br>
                    UV: ${data1.total_uv?.toLocaleString()}<br>
                    URLs: ${data1.total_urls?.toLocaleString()}<br>
                    timestamp: ${data1.timestamp}
                </div>`;

                // 测试2: 获取指定时间戳分析信息
                console.log('2. 测试指定时间戳分析信息API...');
                const response2 = await fetch('http://120.48.54.112:5051/rank/api/get_analysis_info?timestamp=20250718_134011');
                console.log('指定时间戳API响应状态:', response2.status);
                
                const data2 = await response2.json();
                console.log('指定时间戳API响应数据:', data2);
                
                resultsDiv.innerHTML += `<div class="alert alert-success">
                    <strong>指定报告分析信息 (20250718_134011):</strong><br>
                    UV: ${data2.total_uv?.toLocaleString()}<br>
                    URLs: ${data2.total_urls?.toLocaleString()}<br>
                    timestamp: ${data2.timestamp}
                </div>`;

                // 测试3: 获取报告列表
                console.log('3. 测试报告列表API...');
                const response3 = await fetch('http://120.48.54.112:5051/rank/api/get_all_reports');
                console.log('报告列表API响应状态:', response3.status);
                
                const data3 = await response3.json();
                console.log('报告列表API响应数据:', data3);
                
                if (data3.success) {
                    resultsDiv.innerHTML += `<div class="alert alert-warning">
                        <strong>报告列表:</strong><br>
                        总数: ${data3.reports.length}<br>
                        第一个报告: ${data3.reports[0]?.timestamp} (UV: ${data3.reports[0]?.total_uv?.toLocaleString()})
                    </div>`;
                }

                console.log('=== API测试完成 ===');
                
            } catch (error) {
                console.error('API测试过程中发生错误:', error);
                resultsDiv.innerHTML += `<div class="alert alert-danger">
                    <strong>错误:</strong> ${error.message}
                </div>`;
            }
        }

        // 绑定按钮事件
        document.getElementById('testBtn').addEventListener('click', testAPIs);
        
        // 页面加载后自动测试
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM加载完成，3秒后自动开始测试...');
            setTimeout(testAPIs, 3000);
        });
    </script>
</body>
</html>
