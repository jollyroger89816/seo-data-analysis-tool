<!DOCTYPE html>
<html>
<head>
    <title>报告切换测试</title>
    <script>
        function testReportAPI() {
            console.log('开始测试报告API...');
            
            // 测试获取报告列表
            fetch('http://120.48.54.112:5051/rank/api/get_all_reports')
                .then(response => response.json())
                .then(data => {
                    console.log('报告列表:', data);
                    if (data.success && data.reports.length > 0) {
                        // 测试获取第一个报告的详细信息
                        const firstReport = data.reports[0];
                        console.log('测试第一个报告:', firstReport.timestamp);
                        
                        return fetch(`http://120.48.54.112:5051/rank/api/get_report_info/${firstReport.timestamp}`);
                    }
                })
                .then(response => response.json())
                .then(data => {
                    console.log('报告详细信息:', data);
                    document.getElementById('result').innerHTML = '测试完成，请查看控制台日志';
                })
                .catch(error => {
                    console.error('测试失败:', error);
                    document.getElementById('result').innerHTML = '测试失败: ' + error.message;
                });
        }
    </script>
</head>
<body>
    <h1>报告切换API测试</h1>
    <button onclick="testReportAPI()">开始测试</button>
    <div id="result"></div>
</body>
</html>
