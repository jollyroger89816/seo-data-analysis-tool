<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史查询结果管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-hover {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .result-item {
            border-left: 4px solid #667eea;
            background: #f8f9fa;
        }
        .file-info {
            font-size: 0.9em;
            color: #6c757d;
        }
        .action-btn {
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container-fluid">
        <!-- Header -->
        <div class="gradient-bg text-white py-4 mb-4">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col">
                        <h1 class="mb-0">
                            <i class="fas fa-history me-3"></i>历史查询结果管理
                        </h1>
                        <p class="mb-0 mt-2 opacity-75">查看、管理和分析历史排名查询结果</p>
                    </div>
                    <div class="col-auto">
                        <a href="http://127.0.0.1:5051" class="btn btn-light">
                            <i class="fas fa-arrow-left me-2"></i>返回主页
                        </a>
                        <button class="btn btn-outline-light ms-2" onclick="refreshResults()">
                            <i class="fas fa-refresh me-2"></i>刷新
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="container">
            <!-- 统计信息 -->
            <div class="row mb-4">
                <div class="col-md-3">
                    <div class="card text-center card-hover">
                        <div class="card-body">
                            <i class="fas fa-file-excel text-success fa-2x mb-2"></i>
                            <h5 class="card-title mb-0" id="total-files">-</h5>
                            <small class="text-muted">总文件数</small>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center card-hover">
                        <div class="card-body">
                            <i class="fas fa-database text-info fa-2x mb-2"></i>
                            <h5 class="card-title mb-0" id="total-size">-</h5>
                            <small class="text-muted">总文件大小</small>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center card-hover">
                        <div class="card-body">
                            <i class="fas fa-clock text-warning fa-2x mb-2"></i>
                            <h5 class="card-title mb-0" id="latest-date">-</h5>
                            <small class="text-muted">最新查询</small>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center card-hover">
                        <div class="card-body">
                            <i class="fas fa-search text-primary fa-2x mb-2"></i>
                            <h5 class="card-title mb-0" id="total-queries">-</h5>
                            <small class="text-muted">总查询数量</small>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 筛选和搜索 -->
            <div class="card mb-4">
                <div class="card-header">
                    <h6 class="mb-0">
                        <i class="fas fa-filter me-2"></i>筛选和搜索
                    </h6>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3">
                            <label class="form-label">日期范围</label>
                            <select class="form-select" id="date-filter" onchange="applyFilters()">
                                <option value="">全部日期</option>
                                <option value="today">今天</option>
                                <option value="week">本周</option>
                                <option value="month">本月</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">文件大小</label>
                            <select class="form-select" id="size-filter" onchange="applyFilters()">
                                <option value="">全部大小</option>
                                <option value="small">小文件 (<1MB)</option>
                                <option value="medium">中等文件 (1-10MB)</option>
                                <option value="large">大文件 (>10MB)</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">搜索文件名</label>
                            <input type="text" class="form-control" id="search-input" placeholder="输入文件名或时间..." onkeyup="applyFilters()">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">&nbsp;</label>
                            <button class="btn btn-outline-secondary d-block w-100" onclick="clearFilters()">
                                <i class="fas fa-times me-2"></i>清除
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 加载状态 -->
            <div id="loading-spinner" class="text-center py-5" style="display: none;">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">加载中...</span>
                </div>
                <p class="mt-3 text-muted">正在加载历史查询结果...</p>
            </div>

            <!-- 错误提示 -->
            <div id="error-alert" class="alert alert-danger" style="display: none;">
                <i class="fas fa-exclamation-triangle me-2"></i>
                <span id="error-message"></span>
            </div>

            <!-- 历史结果列表 -->
            <div id="results-container">
                <!-- 结果将通过JavaScript动态加载 -->
            </div>

            <!-- 无结果提示 -->
            <div id="no-results" class="text-center py-5" style="display: none;">
                <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
                <h5 class="text-muted">没有找到历史查询结果</h5>
                <p class="text-muted">请先进行一些排名查询，然后返回查看历史结果</p>
                <a href="http://127.0.0.1:5051" class="btn btn-primary">
                    <i class="fas fa-plus me-2"></i>开始查询
                </a>
            </div>
        </div>
    </div>

    <!-- 查看详情模态框 -->
    <div class="modal fade" id="detailModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-chart-bar me-2"></i>查询结果详情
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="detail-content">
                        <!-- 详情内容将通过JavaScript加载 -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                    <button type="button" class="btn btn-primary" onclick="loadToMainPage()">
                        <i class="fas fa-arrow-right me-2"></i>在主页面中查看
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let allResults = [];
        let filteredResults = [];
        let currentDetailTimestamp = null;

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadHistoricalResults();
        });

        // 加载历史查询结果
        async function loadHistoricalResults() {
            showLoading(true);
            hideError();
            
            try {
                const response = await fetch('/rank/api/get_historical_results');
                const data = await response.json();
                
                if (data.success) {
                    allResults = data.results || [];
                    filteredResults = [...allResults];
                    updateStatistics();
                    displayResults();
                } else {
                    showError('加载失败: ' + (data.message || '未知错误'));
                }
            } catch (error) {
                console.error('加载历史结果失败:', error);
                showError('网络错误: ' + error.message);
            } finally {
                showLoading(false);
            }
        }

        // 刷新结果
        function refreshResults() {
            loadHistoricalResults();
        }

        // 更新统计信息
        function updateStatistics() {
            const totalFiles = allResults.length;
            const totalSize = allResults.reduce((sum, result) => sum + result.file_size, 0);
            const latestDate = allResults.length > 0 ? allResults[0].display_time.split(' ')[0] : '-';
            
            document.getElementById('total-files').textContent = totalFiles;
            document.getElementById('total-size').textContent = totalSize.toFixed(2) + ' MB';
            document.getElementById('latest-date').textContent = latestDate;
            document.getElementById('total-queries').textContent = totalFiles > 0 ? '估计 ' + (totalFiles * 50) + '+' : '-';
        }

        // 显示结果列表
        function displayResults() {
            const container = document.getElementById('results-container');
            const noResults = document.getElementById('no-results');
            
            if (filteredResults.length === 0) {
                container.innerHTML = '';
                noResults.style.display = 'block';
                return;
            }
            
            noResults.style.display = 'none';
            
            const html = filteredResults.map(result => `
                <div class="card mb-3 result-item card-hover">
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-md-6">
                                <h6 class="mb-1">
                                    <i class="fas fa-file-excel text-success me-2"></i>
                                    ${result.filename}
                                </h6>
                                <div class="file-info">
                                    <i class="fas fa-clock me-1"></i>查询时间: ${result.display_time}
                                </div>
                            </div>
                            <div class="col-md-2 text-center">
                                <div class="badge bg-primary fs-6">
                                    ${result.file_size} MB
                                </div>
                            </div>
                            <div class="col-md-4 text-end">
                                <button class="btn btn-outline-primary action-btn me-2" onclick="viewDetails('${result.timestamp}')">
                                    <i class="fas fa-eye me-1"></i>查看详情
                                </button>
                                <button class="btn btn-outline-success action-btn me-2" onclick="loadResult('${result.timestamp}')">
                                    <i class="fas fa-download me-1"></i>加载到主页
                                </button>
                                <button class="btn btn-outline-info action-btn" onclick="downloadFile('${result.filename}')">
                                    <i class="fas fa-download me-1"></i>下载
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
            
            container.innerHTML = html;
        }

        // 应用筛选
        function applyFilters() {
            const dateFilter = document.getElementById('date-filter').value;
            const sizeFilter = document.getElementById('size-filter').value;
            const searchText = document.getElementById('search-input').value.toLowerCase();
            
            filteredResults = allResults.filter(result => {
                // 日期筛选
                if (dateFilter) {
                    const resultDate = new Date(result.display_time);
                    const now = new Date();
                    
                    switch (dateFilter) {
                        case 'today':
                            if (resultDate.toDateString() !== now.toDateString()) return false;
                            break;
                        case 'week':
                            const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                            if (resultDate < weekAgo) return false;
                            break;
                        case 'month':
                            const monthAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
                            if (resultDate < monthAgo) return false;
                            break;
                    }
                }
                
                // 文件大小筛选
                if (sizeFilter) {
                    switch (sizeFilter) {
                        case 'small':
                            if (result.file_size >= 1) return false;
                            break;
                        case 'medium':
                            if (result.file_size < 1 || result.file_size > 10) return false;
                            break;
                        case 'large':
                            if (result.file_size <= 10) return false;
                            break;
                    }
                }
                
                // 搜索文本筛选
                if (searchText) {
                    const searchableText = (result.filename + ' ' + result.display_time).toLowerCase();
                    if (!searchableText.includes(searchText)) return false;
                }
                
                return true;
            });
            
            displayResults();
        }

        // 清除筛选
        function clearFilters() {
            document.getElementById('date-filter').value = '';
            document.getElementById('size-filter').value = '';
            document.getElementById('search-input').value = '';
            filteredResults = [...allResults];
            displayResults();
        }

        // 查看详情
        async function viewDetails(timestamp) {
            currentDetailTimestamp = timestamp;
            
            try {
                const response = await fetch(`/rank/api/load_historical_result/${timestamp}`);
                const data = await response.json();
                
                if (data.success) {
                    const results = data.results;
                    displayDetailModal(results, data.source_file);
                } else {
                    alert('加载详情失败: ' + data.error);
                }
            } catch (error) {
                alert('网络错误: ' + error.message);
            }
        }

        // 显示详情模态框
        function displayDetailModal(results, sourceFile) {
            const content = document.getElementById('detail-content');
            
            // 生成统计信息
            const totalCount = results.length;
            const successCount = results.filter(r => !r.error).length;
            const rankedCount = results.filter(r => r.rank && r.rank !== '未找到').length;
            
            // 排名区间统计
            const rankStats = {
                range_1_3: 0, range_4_7: 0, range_8_10: 0, range_10_plus: 0
            };
            
            results.forEach(result => {
                if (result.rank && result.rank !== '未找到') {
                    let actualRank = 0;
                    if (result.rank.includes('-')) {
                        const parts = result.rank.split('-');
                        const page = parseInt(parts[0]);
                        const position = parseInt(parts[1]);
                        actualRank = (page - 1) * 10 + position;
                    } else {
                        actualRank = parseInt(result.rank);
                    }
                    
                    if (actualRank >= 1 && actualRank <= 3) rankStats.range_1_3++;
                    else if (actualRank >= 4 && actualRank <= 7) rankStats.range_4_7++;
                    else if (actualRank >= 8 && actualRank <= 10) rankStats.range_8_10++;
                    else if (actualRank > 10) rankStats.range_10_plus++;
                }
            });
            
            content.innerHTML = `
                <div class="row mb-4">
                    <div class="col-md-3">
                        <div class="text-center">
                            <h4 class="text-primary">${totalCount}</h4>
                            <small class="text-muted">总查询数</small>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="text-center">
                            <h4 class="text-success">${successCount}</h4>
                            <small class="text-muted">成功查询</small>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="text-center">
                            <h4 class="text-info">${rankedCount}</h4>
                            <small class="text-muted">有排名</small>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="text-center">
                            <h4 class="text-warning">${((rankedCount/totalCount)*100).toFixed(1)}%</h4>
                            <small class="text-muted">排名率</small>
                        </div>
                    </div>
                </div>
                
                <div class="card mb-4">
                    <div class="card-header">
                        <h6 class="mb-0">排名分布统计</h6>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered">
                                <thead class="table-dark">
                                    <tr>
                                        <th class="text-center">1-3名</th>
                                        <th class="text-center">4-7名</th>
                                        <th class="text-center">8-10名</th>
                                        <th class="text-center">10名以外</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td class="text-center"><strong>${rankStats.range_1_3}</strong></td>
                                        <td class="text-center"><strong>${rankStats.range_4_7}</strong></td>
                                        <td class="text-center"><strong>${rankStats.range_8_10}</strong></td>
                                        <td class="text-center"><strong>${rankStats.range_10_plus}</strong></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h6 class="mb-0">查询结果详情 (前20条)</h6>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-sm">
                                <thead>
                                    <tr>
                                        <th>序号</th>
                                        <th>关键词</th>
                                        <th>排名</th>
                                        <th>域名</th>
                                        <th>状态</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${results.slice(0, 20).map(result => `
                                        <tr>
                                            <td>${result.index}</td>
                                            <td>${result.final_keyword || result.keywords || '-'}</td>
                                            <td><span class="badge ${result.rank && result.rank !== '未找到' ? 'bg-success' : 'bg-secondary'}">${result.rank || '未找到'}</span></td>
                                            <td>${result.domain}</td>
                                            <td><span class="badge ${result.error ? 'bg-danger' : 'bg-success'}">${result.error ? '失败' : '成功'}</span></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                        ${results.length > 20 ? `<p class="text-muted text-center mt-3">还有 ${results.length - 20} 条结果未显示...</p>` : ''}
                    </div>
                </div>
            `;
            
            const modal = new bootstrap.Modal(document.getElementById('detailModal'));
            modal.show();
        }

        // 加载到主页面
        function loadToMainPage() {
            if (currentDetailTimestamp) {
                window.open(`http://127.0.0.1:5051?load_result=${currentDetailTimestamp}`, '_blank');
            }
        }

        // 加载结果到主页面
        function loadResult(timestamp) {
            window.open(`http://127.0.0.1:5051?load_result=${timestamp}`, '_blank');
        }

        // 下载文件
        function downloadFile(filename) {
            window.open(`/download/${filename}`, '_blank');
        }

        // 显示/隐藏加载状态
        function showLoading(show) {
            document.getElementById('loading-spinner').style.display = show ? 'block' : 'none';
        }

        // 显示错误
        function showError(message) {
            document.getElementById('error-message').textContent = message;
            document.getElementById('error-alert').style.display = 'block';
        }

        // 隐藏错误
        function hideError() {
            document.getElementById('error-alert').style.display = 'none';
        }
    </script>
</body>
</html>
