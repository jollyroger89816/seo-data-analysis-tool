<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台任务管理</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .task-card {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .task-card:hover {
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .task-header {
            background-color: #f8f9fa;
            padding: 15px;
            border-bottom: 1px solid #dee2e6;
            border-radius: 8px 8px 0 0;
        }
        .task-body {
            padding: 15px;
        }
        .status-badge {
            font-size: 0.875rem;
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: 500;
        }
        .status-pending { background-color: #e3f2fd; color: #1976d2; }
        .status-running { background-color: #fff3e0; color: #f57c00; }
        .status-success { background-color: #e8f5e8; color: #388e3c; }
        .status-failed { background-color: #ffebee; color: #d32f2f; }
        .status-cancelled { background-color: #f3e5f5; color: #7b1fa2; }
        .status-retry { background-color: #fff9c4; color: #f9a825; }
        .status-paused { background-color: #e0e0e0; color: #616161; }
        
        .progress-wrapper {
            margin: 10px 0;
        }
        .progress {
            height: 8px;
            border-radius: 4px;
        }
        .task-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .task-actions .btn {
            padding: 5px 10px;
            font-size: 0.875rem;
        }
        .task-details {
            font-size: 0.875rem;
            color: #6c757d;
        }
        .task-details .detail-item {
            margin-bottom: 5px;
        }
        .task-details .detail-item strong {
            color: #495057;
        }
        .stats-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .stats-item {
            text-align: center;
        }
        .stats-number {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .stats-label {
            font-size: 0.875rem;
            opacity: 0.9;
        }
        .refresh-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 1.5rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            z-index: 1000;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loading-spinner {
            color: white;
            font-size: 3rem;
        }
        .task-filters {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 5px 15px;
            border: 1px solid #dee2e6;
            background-color: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .filter-btn:hover {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }
        .filter-btn.active {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1><i class="fas fa-tasks"></i> 后台任务管理</h1>
                    <div>
                        <button class="btn btn-outline-primary" onclick="window.location.href='/'">
                            <i class="fas fa-home"></i> 返回首页
                        </button>
                        <button class="btn btn-primary" onclick="refreshTasks()">
                            <i class="fas fa-sync-alt"></i> 刷新
                        </button>
                    </div>
                </div>

                <!-- 统计信息 -->
                <div class="stats-card">
                    <div class="row">
                        <div class="col-md-2 stats-item">
                            <div class="stats-number" id="total-tasks">0</div>
                            <div class="stats-label">总任务数</div>
                        </div>
                        <div class="col-md-2 stats-item">
                            <div class="stats-number" id="running-tasks">0</div>
                            <div class="stats-label">运行中</div>
                        </div>
                        <div class="col-md-2 stats-item">
                            <div class="stats-number" id="pending-tasks">0</div>
                            <div class="stats-label">等待中</div>
                        </div>
                        <div class="col-md-2 stats-item">
                            <div class="stats-number" id="success-tasks">0</div>
                            <div class="stats-label">成功</div>
                        </div>
                        <div class="col-md-2 stats-item">
                            <div class="stats-number" id="failed-tasks">0</div>
                            <div class="stats-label">失败</div>
                        </div>
                        <div class="col-md-2 stats-item">
                            <div class="stats-number" id="retry-tasks">0</div>
                            <div class="stats-label">重试中</div>
                        </div>
                    </div>
                </div>

                <!-- 任务筛选 -->
                <div class="task-filters">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <strong>筛选任务：</strong>
                            <div class="filter-buttons">
                                <span class="filter-btn active" data-filter="all">全部</span>
                                <span class="filter-btn" data-filter="running">运行中</span>
                                <span class="filter-btn" data-filter="pending">等待中</span>
                                <span class="filter-btn" data-filter="success">成功</span>
                                <span class="filter-btn" data-filter="failed">失败</span>
                                <span class="filter-btn" data-filter="retry">重试</span>
                            </div>
                        </div>
                        <div>
                            <button class="btn btn-outline-danger btn-sm" onclick="cleanupOldTasks()">
                                <i class="fas fa-trash"></i> 清理旧任务
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 任务列表 -->
                <div id="tasks-container">
                    <div class="empty-state">
                        <i class="fas fa-spinner fa-spin"></i>
                        <h4>加载中...</h4>
                        <p>正在获取任务信息</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 浮动刷新按钮 -->
    <button class="btn btn-primary refresh-btn" onclick="refreshTasks()" title="刷新任务列表">
        <i class="fas fa-sync-alt"></i>
    </button>

    <!-- 加载遮罩 -->
    <div class="loading-overlay" id="loading-overlay" style="display: none;">
        <div class="loading-spinner">
            <i class="fas fa-spinner fa-spin"></i>
        </div>
    </div>

    <script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        let tasks = [];
        let currentFilter = 'all';
        let autoRefreshInterval;

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            refreshTasks();
            setupAutoRefresh();
            setupFilterButtons();
        });

        // 设置自动刷新
        function setupAutoRefresh() {
            autoRefreshInterval = setInterval(function() {
                refreshTasks(true); // 静默刷新
            }, 5000); // 每5秒刷新一次
        }

        // 设置筛选按钮事件
        function setupFilterButtons() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    // 更新按钮状态
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    
                    // 更新筛选条件
                    currentFilter = this.dataset.filter;
                    renderTasks();
                });
            });
        }

        // 刷新任务列表
        function refreshTasks(silent = false) {
            if (!silent) {
                showLoading();
            }
            
            fetch('/api/tasks/list')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        tasks = data.tasks;
                        renderTasks();
                        updateStatistics();
                    } else {
                        showError('获取任务列表失败: ' + data.error);
                    }
                })
                .catch(error => {
                    console.error('获取任务列表错误:', error);
                    showError('获取任务列表失败: ' + error.message);
                })
                .finally(() => {
                    if (!silent) {
                        hideLoading();
                    }
                });
        }

        // 渲染任务列表
        function renderTasks() {
            const container = document.getElementById('tasks-container');
            
            // 筛选任务
            let filteredTasks = tasks;
            if (currentFilter !== 'all') {
                filteredTasks = tasks.filter(task => task.status === currentFilter);
            }
            
            // 按创建时间排序
            filteredTasks.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            
            if (filteredTasks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <h4>暂无任务</h4>
                        <p>当前没有${currentFilter === 'all' ? '' : getStatusText(currentFilter)}任务</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            filteredTasks.forEach(task => {
                html += renderTaskCard(task);
            });
            
            container.innerHTML = html;
        }

        // 渲染单个任务卡片
        function renderTaskCard(task) {
            const statusClass = `status-${task.status}`;
            const statusText = getStatusText(task.status);
            const progressPercentage = task.percentage || 0;
            
            return `
                <div class="task-card" data-task-id="${task.task_id}">
                    <div class="task-header">
                        <div class="d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">
                                <i class="fas fa-search"></i>
                                ${task.task_name || '排名查询任务'}
                            </h5>
                            <span class="status-badge ${statusClass}">
                                ${getStatusIcon(task.status)} ${statusText}
                            </span>
                        </div>
                    </div>
                    <div class="task-body">
                        <div class="row">
                            <div class="col-md-8">
                                <div class="task-details">
                                    <div class="detail-item">
                                        <strong>任务ID:</strong> ${task.task_id}
                                    </div>
                                    <div class="detail-item">
                                        <strong>创建时间:</strong> ${formatDateTime(task.created_at)}
                                    </div>
                                    ${task.started_at ? `
                                    <div class="detail-item">
                                        <strong>开始时间:</strong> ${formatDateTime(task.started_at)}
                                    </div>
                                    ` : ''}
                                    ${task.finished_at ? `
                                    <div class="detail-item">
                                        <strong>完成时间:</strong> ${formatDateTime(task.finished_at)}
                                    </div>
                                    ` : ''}
                                    <div class="detail-item">
                                        <strong>关键词数量:</strong> ${task.total_keywords || 0}
                                    </div>
                                    ${task.error_message ? `
                                    <div class="detail-item text-danger">
                                        <strong>错误信息:</strong> ${task.error_message}
                                    </div>
                                    ` : ''}
                                    ${task.retry_count > 0 ? `
                                    <div class="detail-item">
                                        <strong>重试次数:</strong> ${task.retry_count}/${task.max_retries}
                                    </div>
                                    ` : ''}
                                </div>
                                
                                ${task.status === 'running' || task.progress > 0 ? `
                                <div class="progress-wrapper">
                                    <div class="d-flex justify-content-between mb-1">
                                        <span class="small">进度</span>
                                        <span class="small">${task.progress}/${task.total} (${progressPercentage}%)</span>
                                    </div>
                                    <div class="progress">
                                        <div class="progress-bar" style="width: ${progressPercentage}%"></div>
                                    </div>
                                    ${task.current_item ? `
                                    <div class="small text-muted mt-1">
                                        当前: ${task.current_item}
                                    </div>
                                    ` : ''}
                                </div>
                                ` : ''}
                            </div>
                            <div class="col-md-4">
                                <div class="task-actions">
                                    ${getTaskActions(task)}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // 获取任务操作按钮
        function getTaskActions(task) {
            let actions = '';
            
            switch (task.status) {
                case 'pending':
                    actions += `<button class="btn btn-success btn-sm" onclick="startTask('${task.task_id}')">
                        <i class="fas fa-play"></i> 启动
                    </button>`;
                    actions += `<button class="btn btn-warning btn-sm" onclick="pauseTask('${task.task_id}')">
                        <i class="fas fa-pause"></i> 暂停
                    </button>`;
                    break;
                case 'running':
                    actions += `<button class="btn btn-danger btn-sm" onclick="cancelTask('${task.task_id}')">
                        <i class="fas fa-stop"></i> 取消
                    </button>`;
                    break;
                case 'paused':
                    actions += `<button class="btn btn-success btn-sm" onclick="resumeTask('${task.task_id}')">
                        <i class="fas fa-play"></i> 恢复
                    </button>`;
                    break;
                case 'success':
                    actions += `<button class="btn btn-info btn-sm" onclick="viewResults('${task.task_id}')">
                        <i class="fas fa-eye"></i> 查看结果
                    </button>`;
                    actions += `<button class="btn btn-primary btn-sm" onclick="exportResults('${task.task_id}')">
                        <i class="fas fa-download"></i> 导出
                    </button>`;
                    break;
                case 'failed':
                    actions += `<button class="btn btn-warning btn-sm" onclick="retryTask('${task.task_id}')">
                        <i class="fas fa-redo"></i> 重试
                    </button>`;
                    break;
            }
            
            // 通用操作
            actions += `<button class="btn btn-outline-secondary btn-sm" onclick="viewTaskDetails('${task.task_id}')">
                <i class="fas fa-info-circle"></i> 详情
            </button>`;
            
            if (['success', 'failed', 'cancelled'].includes(task.status)) {
                actions += `<button class="btn btn-outline-danger btn-sm" onclick="deleteTask('${task.task_id}')">
                    <i class="fas fa-trash"></i> 删除
                </button>`;
            }
            
            return actions;
        }

        // 获取状态文本
        function getStatusText(status) {
            const statusMap = {
                'pending': '等待中',
                'running': '运行中',
                'success': '成功',
                'failed': '失败',
                'cancelled': '已取消',
                'retry': '重试中',
                'paused': '已暂停'
            };
            return statusMap[status] || status;
        }

        // 获取状态图标
        function getStatusIcon(status) {
            const iconMap = {
                'pending': '<i class="fas fa-clock"></i>',
                'running': '<i class="fas fa-spinner fa-spin"></i>',
                'success': '<i class="fas fa-check"></i>',
                'failed': '<i class="fas fa-times"></i>',
                'cancelled': '<i class="fas fa-ban"></i>',
                'retry': '<i class="fas fa-redo"></i>',
                'paused': '<i class="fas fa-pause"></i>'
            };
            return iconMap[status] || '';
        }

        // 格式化日期时间
        function formatDateTime(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleString('zh-CN');
        }

        // 更新统计信息
        function updateStatistics() {
            const stats = {
                total: tasks.length,
                pending: tasks.filter(t => t.status === 'pending').length,
                running: tasks.filter(t => t.status === 'running').length,
                success: tasks.filter(t => t.status === 'success').length,
                failed: tasks.filter(t => t.status === 'failed').length,
                retry: tasks.filter(t => t.status === 'retry').length
            };
            
            document.getElementById('total-tasks').textContent = stats.total;
            document.getElementById('pending-tasks').textContent = stats.pending;
            document.getElementById('running-tasks').textContent = stats.running;
            document.getElementById('success-tasks').textContent = stats.success;
            document.getElementById('failed-tasks').textContent = stats.failed;
            document.getElementById('retry-tasks').textContent = stats.retry;
        }

        // 任务操作函数
        function startTask(taskId) {
            performTaskAction('start', taskId, '启动任务');
        }

        function cancelTask(taskId) {
            if (confirm('确定要取消这个任务吗？')) {
                performTaskAction('cancel', taskId, '取消任务');
            }
        }

        function pauseTask(taskId) {
            performTaskAction('pause', taskId, '暂停任务');
        }

        function resumeTask(taskId) {
            performTaskAction('resume', taskId, '恢复任务');
        }

        function deleteTask(taskId) {
            if (confirm('确定要删除这个任务吗？此操作不可恢复。')) {
                performTaskAction('delete', taskId, '删除任务', 'DELETE');
            }
        }

        function performTaskAction(action, taskId, actionName, method = 'POST') {
            showLoading();
            
            const url = `/api/tasks/${action}/${taskId}`;
            
            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showSuccess(data.message);
                    refreshTasks();
                } else {
                    showError(actionName + '失败: ' + data.error);
                }
            })
            .catch(error => {
                console.error(actionName + '错误:', error);
                showError(actionName + '失败: ' + error.message);
            })
            .finally(() => {
                hideLoading();
            });
        }

        // 查看任务结果
        function viewResults(taskId) {
            window.open(`/api/tasks/results/${taskId}`, '_blank');
        }

        // 导出任务结果
        function exportResults(taskId) {
            showLoading();
            
            fetch(`/api/tasks/export_results/${taskId}`)
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // 创建下载链接
                    const link = document.createElement('a');
                    link.href = data.download_url;
                    link.download = data.filename;
                    link.click();
                    
                    showSuccess('导出成功: ' + data.filename);
                } else {
                    showError('导出失败: ' + data.error);
                }
            })
            .catch(error => {
                console.error('导出错误:', error);
                showError('导出失败: ' + error.message);
            })
            .finally(() => {
                hideLoading();
            });
        }

        // 查看任务详情
        function viewTaskDetails(taskId) {
            const task = tasks.find(t => t.task_id === taskId);
            if (!task) return;
            
            alert(`任务详情：\n\n任务ID: ${task.task_id}\n状态: ${getStatusText(task.status)}\n创建时间: ${formatDateTime(task.created_at)}\n关键词数量: ${task.total_keywords}\n进度: ${task.progress}/${task.total} (${task.percentage}%)\n${task.error_message ? '\n错误信息: ' + task.error_message : ''}`);
        }

        // 清理旧任务
        function cleanupOldTasks() {
            const days = prompt('请输入要清理多少天前的任务（默认7天）:', '7');
            if (days === null) return;
            
            const daysNum = parseInt(days) || 7;
            
            if (confirm(`确定要清理${daysNum}天前的旧任务吗？此操作不可恢复。`)) {
                showLoading();
                
                fetch('/api/tasks/cleanup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ days: daysNum })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        showSuccess(data.message);
                        refreshTasks();
                    } else {
                        showError('清理失败: ' + data.error);
                    }
                })
                .catch(error => {
                    console.error('清理错误:', error);
                    showError('清理失败: ' + error.message);
                })
                .finally(() => {
                    hideLoading();
                });
            }
        }

        // 工具函数
        function showLoading() {
            document.getElementById('loading-overlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loading-overlay').style.display = 'none';
        }

        function showSuccess(message) {
            // 这里可以使用更好的通知组件
            alert('成功: ' + message);
        }

        function showError(message) {
            // 这里可以使用更好的通知组件
            alert('错误: ' + message);
        }

        // 页面卸载时清理
        window.addEventListener('beforeunload', function() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }
        });
    </script>
</body>
</html>
