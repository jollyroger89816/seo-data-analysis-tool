<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据分析进行中 - 关键词排名分析工具</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.2.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding-top: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /* 导航栏样式 */
        .navbar-custom {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }

        .navbar-custom .navbar-brand {
            color: #667eea !important;
            font-weight: 700;
            font-size: 1.3rem;
        }

        .navbar-custom .navbar-brand i {
            margin-right: 0.5rem;
            color: #764ba2;
        }

        .navbar-custom .navbar-nav .nav-link {
            color: #667eea !important;
            font-weight: 500;
            padding: 0.5rem 1rem !important;
            margin: 0 0.2rem;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .navbar-custom .navbar-nav .nav-link:hover {
            color: #764ba2 !important;
            background: rgba(102, 126, 234, 0.1);
            transform: translateY(-1px);
        }

        .navbar-custom .navbar-nav .nav-link.active {
            color: white !important;
            background: #667eea;
            font-weight: 600;
        }

        .navbar-custom .navbar-toggler {
            border: none;
            color: #667eea;
        }

        .navbar-custom .navbar-toggler:focus {
            box-shadow: none;
        }

        .progress-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 3rem;
            text-align: center;
        }
        .progress-header {
            margin-bottom: 3rem;
        }
        .progress-header h1 {
            color: #333;
            margin-bottom: 0.5rem;
        }
        .progress-header p {
            color: #666;
            font-size: 1.1rem;
        }
        .progress-circle {
            width: 150px;
            height: 150px;
            margin: 2rem auto;
            position: relative;
        }
        .progress-circle svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }
        .progress-circle-bg {
            fill: none;
            stroke: #e9ecef;
            stroke-width: 8;
        }
        .progress-circle-fill {
            fill: none;
            stroke: #28a745;
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 440;
            stroke-dashoffset: 440;
            transition: stroke-dashoffset 0.5s ease;
        }
        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            font-weight: bold;
            color: #28a745;
        }
        .progress-details {
            margin: 2rem 0;
            padding: 1.5rem;
            background-color: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #28a745;
        }
        .progress-step {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 0.5rem;
        }
        .progress-info {
            color: #666;
            font-size: 1rem;
        }
        .file-info {
            margin: 2rem 0;
            padding: 1rem;
            background-color: #e9ecef;
            border-radius: 8px;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #28a745;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .completion-message {
            display: none;
            margin-top: 2rem;
            padding: 1rem;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            color: #155724;
        }
        .error-message {
            display: none;
            margin-top: 2rem;
            padding: 1rem;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            color: #721c24;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-chart-line"></i> 关键词排名分析工具
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index') }}">
                            <i class="fas fa-home"></i> 首页
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index') }}#history-reports">
                            <i class="fas fa-history"></i> 历史报告
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="progress-container">
            <div class="progress-header">
                <h1><i class="fas fa-chart-line"></i> 数据分析进行中</h1>
                <p>正在分析您的数据，请稍候...</p>
            </div>
            
            <div class="file-info">
                <h5><i class="fas fa-file-excel"></i> 分析文件</h5>
                <p><strong>当前年度：</strong> {{ current_filename }}</p>
                {% if previous_filename %}
                <p><strong>上一年度：</strong> {{ previous_filename }}</p>
                {% endif %}
            </div>
            
            <div class="progress-circle">
                <svg>
                    <circle class="progress-circle-bg" cx="75" cy="75" r="70"></circle>
                    <circle class="progress-circle-fill" cx="75" cy="75" r="70" id="progressCircle"></circle>
                </svg>
                <div class="progress-text" id="progressText">0%</div>
            </div>
            
            <div class="progress-details">
                <div class="progress-step" id="currentStep">
                    <span class="spinner"></span>
                    正在初始化...
                </div>
                <div class="progress-info" id="progressInfo">
                    准备开始数据分析
                </div>
            </div>
            
            <div class="completion-message" id="completionMessage">
                <h5><i class="fas fa-check-circle"></i> 分析完成！</h5>
                <p>正在跳转到结果页面...</p>
            </div>
            
            <div class="error-message" id="errorMessage">
                <h5><i class="fas fa-exclamation-triangle"></i> 分析失败</h5>
                <p id="errorText">发生了未知错误</p>
                <button class="btn btn-primary mt-2" onclick="window.location.href='/'">返回首页</button>
            </div>
        </div>
    </div>

    <script>
        const analysisSessionId = '{{ session_id }}';
        let progressInterval;
        let isCompleted = false;
        let isChecking = false;
        let checkInterval;
        
        // 开始轮询进度
        function startProgressPolling() {
            progressInterval = setInterval(function() {
                if (isCompleted) {
                    clearInterval(progressInterval);
                    return;
                }
                
                fetch('/api/progress/' + analysisSessionId)
                    .then(response => response.json())
                    .then(data => {
                        if (data.error) {
                            console.log('进度查询失败:', data.error);
                            return;
                        }
                        
                        updateProgress(data);
                        
                        // 检查是否完成
                        if (data.step === '分析完成' || data.percentage >= 100) {
                            isCompleted = true;
                            clearInterval(progressInterval);
                            showCompletion();
                            setTimeout(function() {
                                window.location.href = '/result/' + analysisSessionId;
                            }, 2000);
                        } else if (data.step === '分析失败') {
                            isCompleted = true;
                            clearInterval(progressInterval);
                            showError(data.details);
                        }
                    })
                    .catch(error => {
                        console.log('进度查询错误:', error);
                    });
            }, 1000); // 每秒查询一次
        }
        
        function updateProgress(data) {
            // 更新进度圆环
            const percentage = data.percentage || 0;
            const circumference = 440;
            const offset = circumference - (percentage / 100) * circumference;
            
            document.getElementById('progressCircle').style.strokeDashoffset = offset;
            document.getElementById('progressText').textContent = percentage + '%';
            
            // 更新步骤信息
            document.getElementById('currentStep').innerHTML = 
                '<span class="spinner"></span>' + data.step;
            document.getElementById('progressInfo').textContent = data.details || '';
        }
        
        function showCompletion() {
            document.querySelector('.spinner').style.display = 'none';
            document.getElementById('currentStep').innerHTML = 
                '<i class="fas fa-check text-success"></i> 分析完成';
            document.getElementById('progressInfo').textContent = '正在跳转到结果页面...';
            document.getElementById('completionMessage').style.display = 'block';
        }
        
        function showError(error) {
            document.querySelector('.spinner').style.display = 'none';
            document.getElementById('currentStep').innerHTML = 
                '<i class="fas fa-times text-danger"></i> 分析失败';
            document.getElementById('progressInfo').textContent = '分析过程中发生错误';
            document.getElementById('errorText').textContent = error;
            document.getElementById('errorMessage').style.display = 'block';
        }
        
        function checkAnalysisComplete() {
            if (isChecking) return;
            isChecking = true;
            
            fetch(`/api/check_analysis/${analysisSessionId}`)
                .then(response => response.json())
                .then(data => {
                    isChecking = false;
                    if (data.is_complete) {
                        clearInterval(checkInterval);
                        clearInterval(progressInterval);
                        showCompletion();
                        setTimeout(function() {
                            window.location.href = `/result/${analysisSessionId}`;
                        }, 2000);
                    }
                })
                .catch(error => {
                    console.error('检查分析状态失败:', error);
                    isChecking = false;
                });
        }
        
        // 页面加载后开始轮询
        document.addEventListener('DOMContentLoaded', function() {
            startProgressPolling();
            checkInterval = setInterval(checkAnalysisComplete, 2000);
        });
        
        // 防止用户刷新页面
        window.addEventListener('beforeunload', function(e) {
            if (!isCompleted) {
                e.preventDefault();
                e.returnValue = '数据分析正在进行中，确定要离开吗？';
            }
        });
        
    </script>
</body>
</html>
